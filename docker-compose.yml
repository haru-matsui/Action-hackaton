name: pm-radar
services:
  app:
    build: ./backend
    container_name: pm-radar
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "5000"
      PM_RADAR_TIMEZONE: ${PM_RADAR_TIMEZONE:-Asia/Yekaterinburg}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    restart: unless-stopped
