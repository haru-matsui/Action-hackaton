name: pm-radar
services:
  app:
    build: ./backend
    container_name: pm-radar
    ports:
      - "5000:5000"
    volumes:
      - pm-data:/app/data        # данные проектов переживают пересборку контейнера
    environment:
      PORT: "5000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    restart: unless-stopped

volumes:
  pm-data:
